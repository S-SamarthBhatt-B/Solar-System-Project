<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#61dafb"/>
            <stop offset="40%" stop-color="#00f0ff"/>
            <stop offset="80%" stop-color="#3a86ff"/>
            <stop offset="100%" stop-color="#8338ec"/>
        </radialGradient>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff"/>
            <stop offset="50%" stop-color="#ffb703"/>
            <stop offset="100%" stop-color="#ff007f"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Dark Space Rounded Canvas -->
    <rect width="64" height="64" rx="16" fill="#05070f"/>

    <!-- Outer Orbit Ring -->
    <ellipse cx="32" cy="32" rx="25" ry="9" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-28 32 32)" filter="url(#glow)"/>

    <!-- Central Glowing Planet -->
    <circle cx="32" cy="32" r="13" fill="url(#planetGrad)" filter="url(#glow)"/>

    <!-- Planet Surface Crescent Highlight -->
    <circle cx="28" cy="27" r="4" fill="#ffffff" opacity="0.45"/>

    <!-- Orbiting Satellite Dot -->
    <circle cx="51" cy="22" r="2.5" fill="#ffb703"/>
</svg>
