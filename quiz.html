<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Trivia Quiz | Test Your Cosmic Knowledge</title>
    <meta name="description" content="Test your cosmic knowledge with our interactive 3D solar system trivia quiz featuring timers, streak combos, and high scores.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="quiz-body">

    <!-- Ambient Cosmic Background Nebulae -->
    <div class="quiz-bg-glow glow-1"></div>
    <div class="quiz-bg-glow glow-2"></div>

    <!-- Confetti Particle Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Top Navigation Header -->
    <header class="quiz-nav">
        <a href="index.html" class="quiz-back-btn">
            <span class="arrow">‹</span> Back to Explorer
        </a>

        <div class="quiz-brand">
            <span class="brand-icon">🌌</span>
            <span>COSMIC TRIVIA</span>
        </div>

        <div class="quiz-stats-header">
            <div class="stat-pill score-pill">
                <span class="stat-label">SCORE</span>
                <span id="score-text" class="stat-value">0</span>
            </div>
            <div class="stat-pill streak-pill">
                <span class="stat-label">STREAK</span>
                <span id="streak-text" class="stat-value">0 🔥</span>
            </div>
        </div>
    </header>

    <!-- Main Centered Quiz Container -->
    <main class="quiz-container">
        
        <!-- Active Question Card -->
        <div id="quiz-board" class="quiz-card glass">
            
            <div class="quiz-card-top">
                <div class="q-badge-group">
                    <span class="badge-category">🪐 Astronomy & ISRO</span>
                    <span id="q-num-text" class="badge-count">Question 1 / 8</span>
                </div>
                <div class="timer-badge">
                    <span class="timer-icon">⏱️</span>
                    <span id="timer-sec-text">15s</span>
                </div>
            </div>

            <!-- Countdown Progress Bar -->
            <div class="timer-bar-container">
                <div id="timer-bar-fill" class="timer-bar-fill"></div>
            </div>

            <!-- Question Prompt Area -->
            <div class="question-area">
                <h2 id="question-text" class="question-text">Loading cosmic question...</h2>
            </div>

            <!-- 4 Multiple Choice Option Grid -->
            <div id="options-grid" class="options-grid">
                <!-- Option Buttons Dynamically Injected via JS -->
            </div>
        </div>

        <!-- Quiz Results & Score Board -->
        <div id="result-board" class="quiz-card glass result-card" style="display: none;">
            <div class="trophy-glow-wrapper">
                <div class="trophy-icon">🏆</div>
            </div>
            
            <h2 class="result-title">Mission Complete!</h2>
            <p class="result-subtitle">You explored the frontiers of space knowledge</p>
            
            <div class="result-score-box">
                <span class="score-label">FINAL SCORE</span>
                <div id="final-score-text" class="final-score-val">0 Pts</div>
                <div id="high-score-text" class="high-score-tag">Best Score: 0</div>
            </div>

            <div class="result-actions">
                <button id="btn-restart-quiz" class="btn-quiz-primary">
                    <span>🔄</span> Play Again
                </button>
                <a href="index.html" class="btn-quiz-secondary">
                    <span>🌌</span> Back to Solar System
                </a>
            </div>
        </div>

    </main>

    <!-- Data and Quiz Engine Scripts -->
    <script src="js/data.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
